[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grim-dawn-encounter-lab"
version = "0.1.0"
description = "Read-only diagnostics and analysis tools for Grim Dawn encounter data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
grim-dawn-lab = "grim_dawn_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
